# Firecrawl-Override für den Crawler-LXC.
#
# Basis: firecrawl/docker-compose.yaml. Seit 2026 gibt es keinen eigenen
# worker-Service mehr – der Worker läuft im api-Container (harness.js).
# Kein Port-Override: n8n im eigenen LXC erreicht Firecrawl über <LXC-IP>:3002,
# daher bleibt die Basis-Bindung (0.0.0.0) bestehen.
services:
  api:
    environment:
      USE_DB_AUTHENTICATION: "false"
  playwright-service:
    shm_size: "1gb"
